name: Go IAM

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform/iam
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: iam-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IAM_TEST_DATABASE_URL: postgres://postgres:iam-ci-test-only@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: platform/iam/go.mod
          cache: true
          cache-dependency-path: platform/iam/go.sum
      - name: Verify module integrity
        run: go mod verify
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Static analysis
        run: go vet ./...
      - name: Test IAM, Gin and PostgreSQL with race detection
        run: go test -race ./...
      - name: Scan reachable dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
